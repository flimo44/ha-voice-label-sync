name: Python checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest PyYAML

      - name: Run unit tests
        run: python -m pytest -q tests/

      - name: Check Python syntax
        run: python -m py_compile scripts/ga_label_sync.py

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.22"
          args: "check ."
